name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run audit:targets
      - run: npm run audit:styles
      - run: npm run audit:modules
      - run: npm run audit:translations
      - run: npm run build
      - run: npm run test:targets
      - run: npm run test:compat:installed
      - run: npm test
      - run: npm run verify:visual
      - run: npm run test:e2e:packaged
