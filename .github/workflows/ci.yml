name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:targets
      - run: npm run audit:styles
      - run: npm run audit:modules
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e:packaged
